name: Daily Guddu Bholu
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow gTTS moviepy google-api-python-client google-auth
      - run: python make_video.py
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
